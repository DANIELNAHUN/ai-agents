[project]
name = "cv-agents"
version = "0.1.0"
description = "Foundations for extracting job requirements and tailoring professional CVs."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.2",
    "langchain>=1.1.0,<2.0.0",
    "pydantic>=2.8.0,<3.0.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_agents"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
